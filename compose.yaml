services:
  postgres:
    image: postgres:17.2-alpine
    container_name: assistencia-db
    environment:
      POSTGRES_DB: assistencia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - assistencia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assistencia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  assistencia-pgdata:
